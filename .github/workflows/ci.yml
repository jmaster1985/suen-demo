name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Run unit tests
        run: python -m pytest -q

  container-e2e:
    name: Build container and run E2E tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    env:
      APP_IMAGE: sensor-data-collector:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag "$APP_IMAGE" .

      - name: Start application and PostgreSQL
        run: docker compose up --detach --no-build

      - name: Wait for the API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Exercise valid measurement flow
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -X POST http://localhost:8000/api/v1/demo/messages \
            -H 'content-type: application/json' \
            -d '{"foo":10,"bar":20,"buzz":30}')
          grep -q '"status":"queued"' <<< "$response"

      - name: Exercise outlier flow
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -X POST http://localhost:8000/api/v1/demo/messages \
            -H 'content-type: application/json' \
            -d '{"foo":1000,"bar":20,"buzz":30}')
          grep -q '"status":"queued"' <<< "$response"

      - name: Exercise invalid payload flow
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/invalid-response \
            --write-out '%{http_code}' \
            -X POST http://localhost:8000/api/v1/demo/messages \
            -H 'content-type: application/json' \
            -d '{"foo":10,"bar":20,"buzz":"invalid"}')
          test "$status" = "400"
          grep -q 'invalid sensor payload' /tmp/invalid-response

      - name: Verify persisted measurements
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            'http://localhost:8000/api/v1/measurements?page=1&page_size=20')
          grep -q '"total":1' <<< "$response"

      - name: Show application logs
        if: always()
        run: docker compose logs app

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Push container image (placeholder)
    runs-on: ubuntu-latest
    needs: container-e2e
    if: ${{ false }}
    steps:
      - name: Push image to registry
        run: echo "Configure registry authentication and docker push here"

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ false }}
    steps:
      - name: Deploy application
        run: echo "Configure deployment credentials and commands here"
